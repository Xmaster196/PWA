<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульти-Калькулятор</title>

    <link rel="stylesheet" href="style.css">
        
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0f0f1a">
    <link rel="apple-touch-icon" href="apple-touch-icon_180.png">
    <meta name="apple-mobile-web-app-status-bar" content="#0f0f1a">
</head>
<body>
    <div class="app">
        <header class="header">
            <img src="icon_192.png" alt="logo" height="44" width="44">
            <h1>Мульти-Калькулятор</h1>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="bmi">ИМТ</button>
            <button class="tab" data-tab="triangle">Площадь △</button>
        </div>

        <section id="bmi" class="panel active">
            <div class="field">
                <label for="height">Рост (см)</label>
                <input type="number" id="height" placeholder="175" inputmode="decimal">
            </div>
            <div class="field">
                <label for="weight">Вес (кг)</label>
                <input type="number" id="weight" placeholder="70" inputmode="decimal">
            </div>
            <div class="field">
                <label for="bmi-result">Ваш ИМТ</label>
                <input type="text" id="bmi-result" readonly placeholder="—">
            </div>
            <button class="action-btn" id="calc-bmi">Рассчитать ИМТ</button>
            <p class="hint" id="bmi-hint"></p>
        </section>

        <section id="triangle" class="panel">
            <div class="field">
                <label for="side-a">Сторона A (см)</label>
                <input type="number" id="side-a" placeholder="3" inputmode="decimal">
            </div>
            <div class="field">
                <label for="side-b">Сторона B (см)</label>
                <input type="number" id="side-b" placeholder="4" inputmode="decimal">
            </div>
            <div class="field">
                <label for="side-c">Сторона C (см)</label>
                <input type="number" id="side-c" placeholder="5" inputmode="decimal">
            </div>
            <div class="field">
                <label for="tri-result">Площадь (см²)</label>
                <input type="text" id="tri-result" readonly placeholder="—">
            </div>
            <button class="action-btn" id="calc-tri">Рассчитать площадь</button>
            <p class="hint" id="tri-hint"></p>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
